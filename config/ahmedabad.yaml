# Ahmedabad pilot configuration.
# Every city-specific value lives here so the pipeline is portable (NFR-5):
# swap this file, rerun, and the whole system targets a different city.

city:
  name: Ahmedabad
  state: Gujarat
  centre: {lat: 23.03, lon: 72.58}
  # Bounding box covering AMC plus immediate periphery.
  # Urban core only (~270 km2), not the full AMC + periphery (~666 km2).
  # Overpass cost scales with area and the periphery adds query time
  # without adding demo value: the wards that matter are all in here.
  bbox: {min_lat: 22.95, max_lat: 23.10, min_lon: 72.50, max_lon: 72.66}
  timezone_offset_hours: 5.5      # IST, UTC+5:30
  elevation_m: 53

hindcast:
  # The May 2010 heatwave: the event that killed ~1,344 people and led directly
  # to India's first Heat Action Plan. Verify figures before quoting on stage.
  start_date: "2010-05-15"
  end_date: "2010-05-25"
  focus_date: "2010-05-21"
  # Peak WBGT is at 14:00, not 15:00: by 15:00 GHI has already fallen
  # 924 -> 704 W/m2 on the peak day, dropping WBGT 33.4 -> 32.4.
  focus_hour_ist: 14              # the kill-gate hour

grid:
  h3_resolution: 8                # ~0.46 km^2 per cell, ~0.7 km edge

urban_heat:
  # Which pattern the pipeline builds on.
  #   lst            satellite surface temperature (measured) -- the default
  #   osm_composite  the older OpenStreetMap formula, kept so the before/after
  #                  comparison is a one-key re-run rather than a rebuild
  mode: lst

  # SUPERSEDED PATH, retained for that comparison: urban form from OpenStreetMap.
  #   dTa_hex = uhi_amplitude_c * (intensity_hex - mean_intensity)
  # The spatial *pattern* is measured from real urban form. The *amplitude* is a
  # literature value, not a local fit -- say this out loud on stage. Indian
  # cities report canopy-layer (air) UHI of roughly 2-5 degC; 3.0 is deliberately
  # conservative. Surface UHI is far larger; do not conflate the two.
  uhi_amplitude_c: 3.0
  uhi_amplitude_range: [2.0, 5.0]   # for the sensitivity sweep
  include_buildings: false          # heaviest Overpass query; roads proxy it well

  # SATELLITE PATH (Phase 5). These keys sat here unread for weeks; scripts/01
  # and sources/gee.py now use them.
  #   dTa = alpha * (LST_hex - LST_city_mean)
  # alpha converts SURFACE heat to AIR heat and is the one number still
  # assumed: fitting it needs ground weather stations we do not have. Surface
  # UHI is several times larger than air UHI -- never quote one as the other.
  alpha: 0.40
  alpha_range: [0.30, 0.50]         # the sensitivity sweep, as with amplitude
  lst_composite:
    years: [2023, 2024, 2025]
    months: [4, 5]                # pre-monsoon, clearest skies
    max_cloud_cover_pct: 10
    # ~25% of the ~800 30 m pixels in a 0.69 km2 zone. Below this the zone's
    # mean is built from too little of itself to trust, so it is excluded from
    # the fit and filled in by the model instead.
    min_valid_px_per_cell: 200
    # Below this the export aborts rather than passing a handful of
    # afternoons off as a three-season climatology.
    min_scenes: 5

    # THE CREDENTIAL-FREE PATH, and the one currently shipping.
    # ORNL DAAC serves MODIS LST subsets as JSON with no registration and no
    # API key, so the pattern is measured today instead of assumed until Earth
    # Engine access lands. 1 km against 0.69 km zones: about 300 distinct
    # pixels back the 392 zones, so the map is honestly blocky at the
    # kilometre scale. Landsat at 30 m is the upgrade, same schema.
    modis:
      # Aqua crosses at ~13:30 and ~01:30 local. The 13:30 pass is within half
      # an hour of the 14:00 IST focus hour -- a far better match than Terra's
      # 10:30, which is why Terra is left free to be the independent check.
      product: MYD11A2
      cross_check_product: MOD11A2
      subset_km: 10                 # +-9.7 km of pixels, covering the bbox
      # QC bits 6-7: 0 is <=1 K, 1 is <=2 K. Accepting <=2 K keeps 100% of
      # pixels; demanding the top flag alone would discard 69% of observations
      # and leave 84 distinct pixels for the whole city -- a stricter screen
      # that produces a worse map. Both counts are printed by the export.
      max_error_class: 1
      min_valid_obs_per_cell: 5     # 8-day composites behind a pixel
      # Half a MODIS pixel diagonal is ~0.66 km. Beyond 1 km a zone is being
      # extrapolated, not measured, so it is flagged instead.
      max_sample_distance_km: 1.0
  downscale:
    features: [ndvi, ndbi, built_s, roads, green, water]
    ridge_lambda_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
    # Parent hexagons as CV groups: 15 blocks on this grid, sizes 2-49. Whole
    # blocks are held out, because hiding scattered zones leaves ~5 of each
    # one's 6 neighbours in training and measures gap-filling, not prediction.
    cv_group_resolution: 6
    cv_folds: 5
    conformal_alpha: 0.10
    # THE PASS MARK, DECLARED BEFORE THE MODEL IS FITTED. Miss it and Phase 5D
    # refuses to write, the existing method stays, and the number is published
    # anyway.
    min_spatial_cv_r2: 0.25

population:
  # Free, global, and gridded: portable to any city (NFR-5), unlike Indian
  # ward-level demographics. This is residential population only -- it says
  # nothing about age or occupation, so the vulnerability row stays NOT FITTED.
  #
  # TWO SOURCES, AND WHICH ONE ACTUALLY RUNS.
  # `source`/`epoch` describe the GHS-POP layer read through Earth Engine in
  # sources/gee.py. That path needs EE credentials, which the offline pipeline
  # deliberately does not use -- the satellite export comes from the
  # no-account ORNL DAAC route for the same reason.
  # scripts/14_population.py therefore reads the same quantity from WorldPop's
  # public zonal-statistics API: no key, JSON in and JSON out. It is also the
  # provider the age-sex data (elderly density, FR-6a) will come from, so
  # numerator and denominator end up from one population model rather than two.
  source: JRC/GHSL/P2023A/GHS_POP        # Earth Engine path (sources/gee.py)
  epoch: 2020
  worldpop_dataset: wpgppop              # credential-free path (script 14)
  year: 2020

siting:
  walk_rings: 1                     # 7 zones, ~0.9 km: a short walk in extreme heat
  n_centres: 12

kill_gate:
  # Day-1 decision thresholds on intra-city WBGT spread at the focus hour.
  proceed_spread_c: 3.0
  pivot_spread_c: 1.5

live:
  # How often the refresher recomputes. Open-Meteo publishes roughly hourly, but
  # the focus hour is "the peak stress hour AHEAD", so it moves with the wall
  # clock and the output genuinely changes between upstream releases.
  refresh_seconds: 300
  # How stale a cached Open-Meteo response may be before it is refetched. Under
  # the upstream hourly cadence, so we never sit on superseded data; at a
  # 5-minute cadence this is ~96 calls/day against a ~10,000/day free tier.
  max_age_minutes: 15
